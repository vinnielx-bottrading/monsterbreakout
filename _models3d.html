<!doctype html><html><body style="margin:0;background:#1a2418"><canvas id="game3d" style="width:1400px;height:520px"></canvas>
<script src="js/core.js"></script><script src="js/props.js"></script><script src="js/weapons.js"></script><script src="js/hero.js"></script><script src="js/enemies.js"></script><script src="js/gates/gate01-jungle.js"></script><script src="js/render3d.js"></script>
<script>
(async()=>{
 await MB.R3.load(); const T=MB.R3.T;
 const r=new T.WebGLRenderer({canvas:document.getElementById('game3d'),antialias:true}); r.setSize(1400,520,false);
 r.outputColorSpace=T.SRGBColorSpace; r.toneMapping=T.ACESFilmicToneMapping; r.toneMappingExposure=1.45; r.shadowMap.enabled=true;
 const sc=new T.Scene(); sc.background=new T.Color('#24331f');
 sc.add(new T.HemisphereLight(0xdff2e4,0x2a3a26,1.7)); const sun=new T.DirectionalLight(0xfff0d0,2.4); sun.position.set(-200,500,300); sun.castShadow=true; sc.add(sun);
 const gr=new T.Mesh(new T.PlaneGeometry(2000,2000),new T.MeshStandardMaterial({color:0x3a4a2e})); gr.rotation.x=-Math.PI/2; gr.receiveShadow=true; sc.add(gr);
 const G={time:1.7};
 const D=MB.R3.debug;
 const h=D.buildHero(); const p=MB.Hero.create(0,0); p.weapons=[MB.Weapons.make('rifle')]; p.aim=-0.5; p.vx=120; p.walk=1.2; p.moveAng=-0.5; D.animHero(p,h,G); h.position.set(-260,0,0); sc.add(h);
 const items=[['zombie',-140,-0.4],['spider',-40,-0.8],['licker',70,-0.5],['spiderQueen',260,-0.6]];
 for(const [k,x,face] of items){ const md=D.MODELS[k]; const g=md.build({}); const e={vx:60,vy:0,t:1,state:'walk',phase:2,boss:k==='spiderQueen',face}; md.anim(e,g,G); g.rotation.y=-face; g.position.set(x,0,0); sc.add(g); }
 const cam=new T.PerspectiveCamera(30,1400/520,10,5000); cam.position.set(window.CX||0,window.CY||260,window.CZ||330); cam.lookAt(window.LX||0,20,0);
 r.render(sc,cam); window.done=true;
})();
</script></body></html>
